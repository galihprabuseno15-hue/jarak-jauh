<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <title>Kontrol Lampu ESP32 Mega Mendung</title>
  <script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>
  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      margin: 0;
      padding: 20px;
      /* Gradasi warna biru khas Batik Mega Mendung */
      background: linear-gradient(135deg, #0a192f, #1e3a8a, #3b82f6, #93c5fd);
      color: white;
      min-height: 100vh;
    }

    .kartu-utama {
      background-color: rgba(255, 255, 255, 0.95);
      color: #1e293b;
      max-width: 350px;
      margin: 40px auto;
      padding: 30px;
      border-radius: 20px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.4);
      border: 4px solid #1e3a8a;
    }

    /* Tampilan Ikon Lampu */
    .gambar-lampu {
      font-size: 100px;
      margin: 20px 0;
      transition: all 0.3s ease;
      filter: grayscale(100%) opacity(0.3); /* Lampu mati (redup) */
    }

    /* Efek Saat Lampu Menyala */
    .lampu-nyala {
      filter: grayscale(0%) drop-shadow(0 0 30px #facc15); /* Cahaya kuning */
      transform: scale(1.1);
    }

    .tombol {
      padding: 12px 24px;
      font-size: 16px;
      font-weight: bold;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      margin: 5px;
      color: white;
    }

    .tombol-on { background-color: #16a34a; }
    .tombol-off { background-color: #dc2626; }
  </style>
</head>
<body>

  <div class="kartu-utama">
    <h2>Kontrol Lampu ESP32</h2>
    <p>☁️ Tema Mega Mendung ☁️</p>

    <!-- Gambar Lampu Interaktif -->
    <div id="lampu" class="gambar-lampu">💡</div>

    <button class="tombol tombol-on" onclick="kirim('ON')">NYALAKAN</button>
    <button class="tombol tombol-off" onclick="kirim('OFF')">MATIKAN</button>
  </div>

  <script>
    const client = mqtt.connect('wss://broker.hivemq.com:8884/mqtt');

    function kirim(perintah) {
      // Mengirim sinyal ke ESP32
      client.publish('rumah/lampu_unik_123', perintah);
      
      // Mengubah tampilan gambar lampu di layar
      const lampuElem = document.getElementById('lampu');
      if (perintah === 'ON') {
        lampuElem.classList.add('lampu-nyala');
      } else {
        lampuElem.classList.remove('lampu-nyala');
      }
    }
  </script>

</body>
</html>
