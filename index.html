<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Kontrol Lampu ESP32</title>
  <script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>
</head>
<body style="text-align: center; font-family: Arial, sans-serif; margin-top: 50px;">

  <h2>Kontrol Lampu ESP32</h2>
  
  <button onclick="kirim('ON')" style="padding: 15px 30px; font-size: 18px; background-color: green; color: white; border: none; border-radius: 5px; cursor: pointer;">
    NYALAKAN
  </button>
  
  <button onclick="kirim('OFF')" style="padding: 15px 30px; font-size: 18px; background-color: red; color: white; border: none; border-radius: 5px; cursor: pointer;">
    MATIKAN
  </button>

  <script>
    // Menggunakan jalur aman port 8884 untuk browser
    const client = mqtt.connect('wss://broker.hivemq.com:8884/mqtt');

    function kirim(perintah) {
      // Topik unik yang sama dengan di Python
      client.publish('rumah/lampu_unik_123', perintah);
    }
  </script>

</body>
</html>
