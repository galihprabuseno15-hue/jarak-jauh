<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Kontrol Lampu ESP32</title>
  <!-- Pustaka MQTT untuk koneksi web -->
  <script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>
</head>
<body style="text-align: center; font-family: Arial, sans-serif; margin-top: 50px;">

  <h2>Kontrol Lampu ESP32</h2>
  
  <button onclick="kirim('ON')" style="padding: 15px 30px; font-size: 18px; background-color: green; color: white; border: none; border-radius: 5px;">
    NYALAKAN
  </button>
  
  <button onclick="kirim('OFF')" style="padding: 15px 30px; font-size: 18px; background-color: red; color: white; border: none; border-radius: 5px;">
    MATIKAN
  </button>

  <script>
    // Menghubungkan web ke server internet HiveMQ
    const client = mqtt.connect('wss://broker.hivemq.com:8000/mqtt');

    function kirim(perintah) {
      // Mengirim perintah 'ON' atau 'OFF' ke topik yang sama dengan ESP32
      client.publish('rumah/lampu', perintah);
    }
  </script>

</body>
</html>
